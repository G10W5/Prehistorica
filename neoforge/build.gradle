plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

def pinFor(String key) {
    return project.property("pin.${project.mc_version}.${key}")
}

def mcRange = "[${project.mc_min},${project.mc_max})"

neoForge {
    version = pinFor('neoforge')

    runs {
        server {
            server()
        }
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':common')
}

processResources {
    inputs.property 'mcRange', mcRange
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mcRange': mcRange
    }
}

tasks.jar {
    from(project(':common').sourceSets.main.output)
}
