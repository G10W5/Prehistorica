org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

maven_group=com.prehistorica
mod_id=prehistorica
mod_name=Prehistorica
mod_version=0.1.0
mod_authors=Prehistorica Team
mod_description=Dinosaur revival and park-building for Minecraft 26.x

# default build target; override with -Pmc_version=26.2 or 26.3
mc_version=26.1.2

# universal jar manifest window: fabric gets ">=min <max", neoforge gets "[min,max)"
mc_min=26.1.2
mc_max=26.4

# per-MC-version pins: pin.<mc>.fabricapi / pin.<mc>.neoforge / pin.<mc>.mc_range
pin.26.1.2.fabricapi=0.155.3+26.1.2
pin.26.1.2.neoforge=26.1.2.122
pin.26.1.2.mc_range=>=26.1.2 <26.2
pin.26.2.fabricapi=0.161.0+26.2
pin.26.2.neoforge=26.2.0.93
pin.26.2.mc_range=>=26.2 <26.3
pin.26.3.fabricapi=0.163.0+26.3
pin.26.3.neoforge=26.3.0.89
pin.26.3.mc_range=>=26.3 <26.4

fabric_loader_version=0.20.0
loom_version=1.16.3
moddev_version=2.0.148
forgix_version=2.0.0

# 26.x is unobfuscated: disable Loom's mapping/remap pipeline entirely
fabric.loom.disableObfuscation=true
